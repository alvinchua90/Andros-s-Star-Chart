<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Andros's Star Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8ED1FC;
    --sky-bottom:#FFE9C7;
    --sun:#FFD166;
    --coral:#FF8FAB;
    --card:#FFFFFF;
    --ink:#3A3358;
    --ink-soft:#7A749B;
    --lavender:#C9A6FF;
    --mint:#8DE7C7;
    --night-top:#1B1640;
    --night-mid:#332863;
    --night-bottom:#5A4088;
    --star-gold:#FFE29A;
    --pink-deep:#E8567A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    transition:background 1s ease;
    overflow-x:hidden;
  }
  body.night-mode{
    background:linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-bottom) 100%);
  }
  .display{font-family:'Baloo 2', sans-serif;}
  #app{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 60px;
    position:relative;
    min-height:100vh;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .icon-btn{
    border:none; cursor:pointer; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.55); display:flex; align-items:center; justify-content:center;
    font-size:18px; transition:transform .15s ease, background .3s ease;
  }
  .icon-btn:active{transform:scale(0.88);}
  .night-mode .icon-btn{ background:rgba(255,255,255,0.14); }

  /* ---------- mascot ---------- */
  .mascot-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
  .mascot{
    width:88px; height:88px; position:relative;
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-8px) rotate(3deg);} }
  .mascot-star{
    position:absolute; inset:0;
    background:radial-gradient(circle at 35% 30%, #FFF6D9, var(--sun) 65%, #F2A93C);
    clip-path:polygon(50% 0%,63% 35%,100% 38%,72% 60%,82% 100%,50% 78%,18% 100%,28% 60%,0% 38%,37% 35%);
    filter:drop-shadow(0 6px 6px rgba(122,75,0,0.25));
  }
  .mascot-face{ position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .mascot-eyes{ display:flex; gap:12px; }
  .eye{ width:7px; height:7px; border-radius:50%; background:#5A3B00; }
  .eye.happy{ width:9px; height:5px; border-radius:0 0 9px 9px; background:transparent; border-bottom:3px solid #5A3B00; }
  .eye.sleepy{ width:9px; height:3px; border-radius:3px; background:#5A3B00; }
  .mouth{ width:10px; height:6px; border-radius:0 0 10px 10px; border:2.5px solid #5A3B00; border-top:none; }
  .mouth.o{ width:8px; height:8px; border-radius:50%; border:2.5px solid #5A3B00; }
  .mouth.sleepy{ width:8px; height:0; border-bottom:2.5px solid #5A3B00; border-radius:0; }
  .mascot-name{ font-weight:800; font-size:12px; color:var(--ink-soft); letter-spacing:.5px; margin-top:2px;}
  .night-mode .mascot-name{ color:#C9C4F2; }
  .zzz{ position:absolute; top:-10px; right:-14px; font-weight:800; color:#C9C4F2; font-size:13px; opacity:0; }
  .night-mode .zzz{ animation:floatz 2.6s ease-in-out infinite; }
  @keyframes floatz{ 0%{opacity:0; transform:translateY(0) scale(.7);} 30%{opacity:1;} 100%{opacity:0; transform:translateY(-22px) scale(1.1);} }

  h1.title{ text-align:center; font-weight:800; font-size:26px; color:var(--ink); margin:2px 0 0; }
  .night-mode h1.title{ color:#FFE9C7; }
  .subdate{ text-align:center; color:var(--ink-soft); font-weight:700; font-size:13px; margin-bottom:14px; }
  .night-mode .subdate{ color:#B9B3E8; }

  /* ---------- progress card ---------- */
  .progress-card{
    background:rgba(255,255,255,0.65); border-radius:20px; padding:12px 16px; margin-bottom:16px;
    backdrop-filter:blur(2px);
  }
  .night-mode .progress-card{ background:rgba(255,255,255,0.08); }
  .progress-row{ display:flex; justify-content:space-between; font-weight:700; font-size:14px; color:var(--ink); margin-bottom:8px; }
  .night-mode .progress-row{ color:#FFE9C7; }
  .progress-track{ height:14px; border-radius:999px; background:rgba(58,51,88,0.12); overflow:hidden; position:relative; }
  .night-mode .progress-track{ background:rgba(255,255,255,0.15); }
  .progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--coral), var(--star-gold)); transition:width .5s cubic-bezier(.34,1.56,.64,1); position:relative; }
  .progress-walker{ position:absolute; top:-13px; right:-10px; font-size:20px; transition:right .5s ease; }

  /* ---------- task grid ---------- */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .task-card{
    border:none; cursor:pointer; border-radius:24px; padding:16px 8px 14px;
    background:var(--card); box-shadow:0 6px 0 rgba(58,51,88,0.10);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s ease, background .35s ease, box-shadow .2s ease;
    position:relative; overflow:visible;
  }
  .task-card:active{ transform:scale(0.94) translateY(2px); box-shadow:0 3px 0 rgba(58,51,88,0.10); }
  .task-card.done{ background:linear-gradient(160deg, #FFF2C4, var(--star-gold)); box-shadow:0 6px 0 rgba(210,163,20,0.4); }
  .task-card.pop{ animation:cardpop .5s ease; }
  @keyframes cardpop{ 0%{transform:scale(1);} 35%{transform:scale(1.16) rotate(-2deg);} 60%{transform:scale(0.96) rotate(2deg);} 100%{transform:scale(1);} }
  .task-icon-wrap{
    width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:#F3F0FF; font-size:26px; transition:background .3s ease;
  }
  .task-card.done .task-icon-wrap{ background:rgba(255,255,255,0.6); }
  .task-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); text-align:center; line-height:1.15; }
  .task-check{ font-size:11px; font-weight:800; color:#8A6300; display:flex; align-items:center; gap:3px; }

  .cta-night{
    display:block; width:100%; border:none; cursor:pointer; border-radius:999px; padding:15px 0;
    background:linear-gradient(90deg, var(--night-mid), #6a4fae); color:#FFE9C7;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:16px; margin-bottom:16px;
    box-shadow:0 6px 0 rgba(30,20,60,0.35);
  }
  .cta-night:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(30,20,60,0.35); }

  /* ---------- history strip ---------- */
  .history-card{ background:rgba(255,255,255,0.5); border-radius:18px; padding:12px 14px; }
  .night-mode .history-card{ background:rgba(255,255,255,0.08); }
  .history-title{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px; color:var(--ink); margin-bottom:8px; }
  .night-mode .history-title{ color:#E4E0FF; }
  .history-row{ display:flex; justify-content:space-between; }
  .history-day{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .history-dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; background:rgba(58,51,88,0.08); }
  .history-dot.full{ background:var(--star-gold); }
  .history-label{ font-size:10px; color:var(--ink-soft); }
  .night-mode .history-label{ color:#B9B3E8; }

  /* ---------- night scene ---------- */
  .night-scene{ position:relative; min-height:66vh; display:flex; flex-direction:column; align-items:center; padding-top:10px; }
  .constellation-svg{ position:absolute; top:0; left:0; width:100%; height:230px; pointer-events:none; }
  .moon{
    width:104px; height:104px; border-radius:50%; margin-top:26px; margin-bottom:14px;
    background:radial-gradient(circle at 35% 32%, #FFFBEA, #FFE9A8 60%, #EAC066);
    box-shadow:0 0 70px rgba(255,233,168,0.55);
    position:relative; animation:floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  .moon-face{ position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); display:flex; gap:16px; }
  .moon-eye{ width:5px; height:5px; border-radius:3px; background:#B98A3B; }
  .moon-mouth{ position:absolute; bottom:26%; left:50%; transform:translate(-50%,0); width:14px; height:7px; border-bottom:2.5px solid #B98A3B; border-radius:0 0 10px 10px; }

  .night-heading{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:25px; color:#FFE9C7; text-align:center; margin:0 0 2px; }
  .night-sub{ color:#C9C4F2; font-weight:700; font-size:12.5px; margin-bottom:20px; text-align:center; }

  .quote-bubble{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22); border-radius:22px;
    padding:22px 22px; max-width:340px; text-align:center; backdrop-filter:blur(3px);
  }
  .quote-emoji{ font-size:26px; margin-bottom:6px; }
  .quote-text{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:17px; color:#FFF6E4; line-height:1.45; min-height:48px; }
  .quote-cursor{ display:inline-block; width:3px; background:#FFE9A8; animation:blink 1s step-start infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  .back-btn{
    margin-top:26px; border:none; cursor:pointer; border-radius:999px; padding:11px 22px;
    background:rgba(255,255,255,0.14); color:#FFE9C7; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
  }
  .back-btn:active{ transform:scale(0.95); }

  /* ---------- confetti ---------- */
  .confetti-piece{
    position:fixed; top:0; left:0; width:8px; height:8px; border-radius:2px; pointer-events:none; z-index:999;
    animation:confetti-fall 1.1s ease-out forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:var(--c-end); opacity:0; }
  }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); opacity:0;
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:700;
    transition:opacity .3s ease, transform .3s ease; z-index:1000; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .fade-in{ animation:riseIn .5s ease; }
  @keyframes riseIn{ 0%{opacity:0; transform:translateY(14px);} 100%{opacity:1; transform:translateY(0);} }

  ::selection{ background:var(--lavender); color:white; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   ANDROS'S STAR DAY — standalone, deployable, no build step
   Data persists in the browser via localStorage.
   ========================================================= */

const STORAGE_PREFIX = "androsStar:";
const RANDOM_ACTIVITIES = [
  { id: "cycling",    label: "Cycling",       emoji: "🚲" },
  { id: "singing",    label: "Singing Time",  emoji: "🎤" },
  { id: "dancing",    label: "Dance Party",   emoji: "🪩" },
  { id: "ntuc",       label: "Go to NTUC",    emoji: "🛒" },
  { id: "helpmummy",  label: "Help Mummy",    emoji: "💛" },
  { id: "story",      label: "Story Time",    emoji: "📖" },
  { id: "puzzle",     label: "Puzzle Time",   emoji: "🧩" },
  { id: "park",       label: "Playground",    emoji: "🌳" },
  { id: "drawing",    label: "Drawing",       emoji: "🎨" },
];
const QUOTES = [
  "Andros, you are Mummy and Daddy's superstar!",
  "Andros is so brave and kind today!",
  "Way to go, Andros! You did it all by yourself!",
  "Andros has the biggest, brightest smile today!",
  "Today, Andros shone bright like a star!",
  "Andros is growing so strong and so clever!",
  "Mummy and Daddy love Andros to the moon and back!",
  "Andros, you make every day brighter!",
  "Super Andros saves the day again!",
  "Andros did an amazing job today. So proud of you!",
];
const CONFETTI_COLORS = ["#FF8FAB","#FFD166","#8DE7C7","#C9A6FF","#8ED1FC"];

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const niceDate = d => d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
function hashString(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }

function buildTasks(todayKey){
  const idx = hashString(todayKey) % RANDOM_ACTIVITIES.length;
  const r = RANDOM_ACTIVITIES[idx];
  return [
    { id:"breakfast", label:"Breakfast",       emoji:"🍳" },
    { id:"shower-am", label:"Morning Shower",  emoji:"🚿" },
    { id:"school",    label:"Go to School",    emoji:"🎒" },
    { id:"random-"+r.id, label:r.label,        emoji:r.emoji },
    { id:"shower-pm", label:"Night Shower",    emoji:"🛁" },
    { id:"dinner",    label:"Dinner",          emoji:"🍽️" },
    { id:"sleep",     label:"Go to Sleep",     emoji:"🌙" },
  ];
}

function loadLog(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+"log:"+key);
    return raw ? JSON.parse(raw) : { tasks:{}, order:[], quote:null };
  }catch(e){ return { tasks:{}, order:[], quote:null }; }
}
function saveLog(key, log){
  try{ localStorage.setItem(STORAGE_PREFIX+"log:"+key, JSON.stringify(log)); }catch(e){ /* storage full or blocked */ }
}
function isMuted(){ return localStorage.getItem(STORAGE_PREFIX+"muted") === "1"; }
function setMuted(v){ localStorage.setItem(STORAGE_PREFIX+"muted", v ? "1":"0"); }

/* ---------- sound (tiny synth, no assets) ---------- */
let audioCtx = null;
function ctx(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } return audioCtx; }
function tone(freq, start, dur, type="sine", vol=0.12){
  if(isMuted()) return;
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, c.currentTime+start);
  gain.gain.linearRampToValueAtTime(vol, c.currentTime+start+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+start+dur);
  osc.connect(gain).connect(c.destination);
  osc.start(c.currentTime+start);
  osc.stop(c.currentTime+start+dur+0.05);
}
function playPop(){ tone(880,0,0.12,"triangle",0.14); tone(1200,0.06,0.1,"triangle",0.08); }
function playFanfare(){ [523,659,784,1047].forEach((f,i)=> tone(f, i*0.11, 0.35,"triangle",0.12)); }
function playLullaby(){ [784,659,523,392].forEach((f,i)=> tone(f, i*0.28, 0.6,"sine",0.09)); }

/* ---------- confetti ---------- */
function burstConfetti(x, y, count=16){
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*70;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist - 30;
    const rot = (Math.random()*720-360)+"deg";
    el.style.setProperty("--c-end", `translate(${dx}px, ${dy}px) rotate(${rot})`);
    el.style.left = x+"px"; el.style.top = y+"px";
    el.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    el.style.borderRadius = Math.random()>0.5 ? "50%" : "2px";
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 1200);
  }
}

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ---------- app state ---------- */
const today = new Date();
const todayKey = dateKey(today);
const tasks = buildTasks(todayKey);
let log = loadLog(todayKey);
let viewNight = Object.keys(log.tasks).length>0 && tasks.every(t=>log.tasks[t.id]);
let justPopped = null;

function isAllDone(){ return tasks.every(t => log.tasks[t.id]); }

function last7Days(){
  const out = [];
  for(let i=1;i<=7;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const l = loadLog(dateKey(d));
    const done = Object.values(l.tasks||{}).filter(Boolean).length;
    out.push({ date:d, done, total:7 });
  }
  return out.reverse();
}
function currentStreak(hist){
  let s = isAllDone() ? 1 : 0;
  for(let i=hist.length-1;i>=0;i--){ if(hist[i].done===hist[i].total) s++; else break; }
  return s;
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("night-mode", viewNight);
  const app = document.getElementById("app");
  const hist = last7Days();
  const streak = currentStreak(hist);
  const doneCount = tasks.filter(t=>log.tasks[t.id]).length;

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="soundBtn" title="Sound">${isMuted() ? "🔇" : "🔊"}</button>
      <div></div>
      <button class="icon-btn" id="resetBtn" title="Fix today's stars">↺</button>
    </div>

    <div class="mascot-wrap">
      <div class="mascot">
        <div class="mascot-star"></div>
        <div class="zzz">z z z</div>
        <div class="mascot-face">
          <div class="mascot-eyes">
            ${viewNight
              ? `<div class="eye sleepy"></div><div class="eye sleepy"></div>`
              : (justPopped ? `<div class="eye happy"></div><div class="eye happy"></div>` : `<div class="eye"></div><div class="eye"></div>`)}
          </div>
          <div class="mouth ${viewNight ? "sleepy" : (justPopped ? "o" : "")}"></div>
        </div>
      </div>
      <div class="mascot-name">TWINKLE</div>
    </div>

    <h1 class="title">${viewNight ? "Good Night, Andros" : "Andros's Day"}</h1>
    <div class="subdate">${viewNight ? `All ${tasks.length} stars earned today` : niceDate(today)}</div>

    ${viewNight ? renderNight(streak) : renderDay(doneCount, hist, streak)}
  `;

  attachHandlers();
}

function renderDay(doneCount, hist, streak){
  const pct = Math.round((doneCount/tasks.length)*100);
  return `
    <div class="progress-card">
      <div class="progress-row"><span>${doneCount} of ${tasks.length} stars</span><span>🔥 ${streak} day streak</span></div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"><span class="progress-walker">${pct>92?"🐣":""}</span></div>
      </div>
    </div>

    <div class="grid">
      ${tasks.map(t=>{
        const done = !!log.tasks[t.id];
        return `
          <button class="task-card ${done?"done":""} ${justPopped===t.id?"pop":""}" data-id="${t.id}">
            <div class="task-icon-wrap">${done ? "⭐" : t.emoji}</div>
            <div class="task-label">${t.label}</div>
            ${done ? `<div class="task-check">✓ Done</div>` : ``}
          </button>
        `;
      }).join("")}
    </div>

    ${isAllDone() ? `<button class="cta-night" id="seeNightBtn">🌙 See Andros's Goodnight Sky</button>` : ``}

    <div class="history-card">
      <div class="history-title">Last 7 days</div>
      <div class="history-row">
        ${hist.map(h=>{
          const full = h.done===h.total;
          return `
            <div class="history-day">
              <div class="history-dot ${full?"full":""}">${full ? "⭐" : (h.done>0?h.done:"")}</div>
              <div class="history-label">${h.date.toLocaleDateString(undefined,{weekday:"narrow"})}</div>
            </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function renderNight(streak){
  const positions = [
    {x:14,y:12},{x:70,y:20},{x:45,y:6},{x:25,y:32},
    {x:86,y:28},{x:58,y:16},{x:8,y:36}
  ];
  const order = log.order && log.order.length===tasks.length ? log.order : tasks.map(t=>t.id);
  const pts = order.map(id => {
    const i = tasks.findIndex(t=>t.id===id);
    const p = positions[i % positions.length];
    return { x: p.x, y: p.y };
  });
  const pathD = pts.map((p,i)=> `${i===0?"M":"L"} ${p.x} ${p.y*2.3}`).join(" ");

  return `
    <div class="night-scene">
      <svg class="constellation-svg" viewBox="0 0 100 230" preserveAspectRatio="none">
        <path d="${pathD}" fill="none" stroke="rgba(255,226,154,0.35)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 4"/>
      </svg>
      ${pts.map((p,i)=>`
        <div style="position:absolute; top:${p.y*2.3}px; left:${p.x}%; animation:twinkle ${2+(i%3)}s ease-in-out infinite; animation-delay:${i*0.25}s;">
          <span style="font-size:${i%2===0?20:14}px;">⭐</span>
        </div>
      `).join("")}
      <div class="moon">
        <div class="moon-face">
          <div class="moon-eye"></div><div class="moon-eye"></div>
        </div>
        <div class="moon-mouth"></div>
      </div>
      <div class="night-sub">🔥 ${streak} day streak · today's trail across the sky</div>
      <div class="quote-bubble">
        <div class="quote-emoji">💛</div>
        <div class="quote-text" id="quoteText"></div>
      </div>
      <button class="back-btn" id="backBtn">Back to Today's Stars</button>
    </div>
    <style>@keyframes twinkle{0%,100%{opacity:.35; transform:scale(.85);} 50%{opacity:1; transform:scale(1.2);}}</style>
  `;
}

/* ---------- typewriter for the goodnight quote ---------- */
function typeQuote(text){
  const el = document.getElementById("quoteText");
  if(!el) return;
  el.innerHTML = "";
  let i = 0;
  const cursor = document.createElement("span");
  cursor.className = "quote-cursor";
  cursor.textContent = "\u00A0";
  function step(){
    if(i <= text.length){
      el.textContent = text.slice(0,i);
      el.appendChild(cursor);
      i++;
      setTimeout(step, 34);
    }
  }
  step();
}

/* ---------- interactions ---------- */
function attachHandlers(){
  const soundBtn = document.getElementById("soundBtn");
  if(soundBtn) soundBtn.onclick = ()=>{ setMuted(!isMuted()); render(); };

  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm("Reset all of today's stars?")){
      log = { tasks:{}, order:[], quote:null };
      saveLog(todayKey, log);
      viewNight = false;
      render();
      showToast("Today's stars have been reset");
    }
  };

  document.querySelectorAll(".task-card").forEach(btn=>{
    btn.onclick = (e)=> toggleTask(btn.dataset.id, e);
  });

  const seeNightBtn = document.getElementById("seeNightBtn");
  if(seeNightBtn) seeNightBtn.onclick = ()=>{ viewNight = true; render(); playLullaby(); setTimeout(()=> typeQuote(log.quote||""), 250); };

  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.onclick = ()=>{ viewNight = false; render(); };

  if(viewNight){ setTimeout(()=> typeQuote(log.quote||""), 250); }
}

function toggleTask(id, evt){
  const nowDone = !log.tasks[id];
  log.tasks[id] = nowDone;
  if(nowDone){
    log.order = (log.order||[]).filter(x=>x!==id);
    log.order.push(id);
    const rect = evt.currentTarget.getBoundingClientRect();
    burstConfetti(rect.left+rect.width/2, rect.top+rect.height/2, 14);
    playPop();
  } else {
    log.order = (log.order||[]).filter(x=>x!==id);
  }

  justPopped = nowDone ? id : null;

  if(isAllDone() && !log.quote){
    log.quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
    saveLog(todayKey, log);
    render();
    setTimeout(()=>{
      burstConfetti(window.innerWidth/2, window.innerHeight*0.35, 40);
      playFanfare();
      showToast("All stars earned today! ✨");
    }, 150);
    setTimeout(()=> justPopped=null, 500);
    return;
  }
  if(!isAllDone() && log.quote){ log.quote = null; }

  saveLog(todayKey, log);
  render();
  setTimeout(()=> justPopped=null, 500);
}

render();
</script>
